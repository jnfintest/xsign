# XcodeGen spec — run `xcodegen generate` to create XSign.xcodeproj.
name: XSign
options:
  bundleIdPrefix: com.jnfintest
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "6"
    DEVELOPMENT_TEAM: ""

packages:
  XSignCore:
    path: Packages/XSignCore
  # zsign (MIT) packaged for SwiftPM. Pinned to a revision because the package
  # uses unsafeFlags, which SwiftPM only allows for non-version requirements.
  Zsign:
    url: https://github.com/khcrysalis/Zsign-Package
    revision: c4ba9da4283031c07efa03bce42c4b8602d22e73
  Vapor:
    url: https://github.com/vapor/vapor
    from: 4.104.0
  NIOSSL:
    url: https://github.com/apple/swift-nio-ssl
    from: 2.27.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
  # Apple's X.509 library: makes the local install certificate on the device.
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    from: 1.0.0

targets:
  XSign:
    type: application
    platform: iOS
    sources:
      - path: XSign
    dependencies:
      - package: XSignCore
      - package: Zsign
        product: Zsign
      - package: Vapor
        product: Vapor
      - package: NIOSSL
        product: NIOSSL
      - package: ZIPFoundation
      - package: SwiftCertificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jnfintest.xsign
        PRODUCT_NAME: XSign
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    info:
      path: XSign/Info.plist
      properties:
        CFBundleDisplayName: XSign
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.jnfintest.xsign.refresh
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.jnfintest.xsign
            CFBundleURLSchemes:
              - xsign
        CFBundleDocumentTypes:
          - CFBundleTypeName: iOS App
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.apple.itunes.ipa
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.apple.itunes.ipa
            UTTypeDescription: iOS App Package
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - ipa
          - UTTypeIdentifier: com.apple.mobileprovision
            UTTypeDescription: Provisioning Profile
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - mobileprovision
    scheme:
      testTargets: []
